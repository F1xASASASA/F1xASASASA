name: Generate Project Cards

on:
  schedule:
    - cron: "0 3 * * *"   # раз в сутки — обновляет звёзды/форки
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "generate_projects.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate_projects.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/projects.svg
          git diff --staged --quiet || git commit -m "chore: обновлены карточки проектов"
          git push
