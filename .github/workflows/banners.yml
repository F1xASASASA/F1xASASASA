name: Generate Profile Banners

on:
  workflow_dispatch: {}   # запуск вручную из вкладки Actions
  push:
    branches:
      - main
    paths:
      - "generate_banners.py"   # перегенерировать при изменении скрипта

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate banners
        run: python3 generate_banners.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: обновлены баннеры профиля"
          git push
